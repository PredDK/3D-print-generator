<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D-print generator</title>
<style>
:root{--bg:#f4f2ee;--panel:#ffffff;--ink:#1d1d1b;--mute:#6d6a63;--line:#e3dfd7;--acc:#d9622b;--acc2:#2b7a78;color-scheme:light}
*{box-sizing:border-box}
button,input,select,textarea{color:var(--ink);background-color:#fff;font:inherit}
html,body{margin:0;height:100%;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:flex;height:100vh}
#panel{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 18px 28px}
h1{font-size:18px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:12.5px;margin:0 0 6px}
.sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.row{margin:0 0 10px}
.row label{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:3px;gap:8px}
.row input[type=number]{width:64px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;text-align:right}
.row input[type=text]{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.row input[type=range]{width:100%;accent-color:var(--acc)}
.row.chk label{justify-content:flex-start;cursor:pointer}
.row.chk input{accent-color:var(--acc);width:16px;height:16px}
.row select{padding:3px 6px;border:1px solid var(--line);border-radius:6px;max-width:190px}
.note{font-size:12px;color:var(--mute);margin:-4px 0 10px}
.stats{background:#faf8f4;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-top:14px}
.stats div{display:flex;justify-content:space-between;padding:2px 0;gap:10px}
.stats b{font-weight:600;text-align:right}
.warn{background:#fff3e8;border:1px solid #f1c7a6;color:#8a3b10;border-radius:10px;padding:8px 12px;font-size:12.5px;margin-top:10px;display:none}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;padding:8px 12px}
button:disabled{opacity:.45;cursor:default}
#dl{width:100%;margin-top:14px;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;padding:11px}
#dl:hover{filter:brightness(1.05)}
#dlExtra{width:100%;margin-top:6px;font-size:13px}
#msg{font-size:12.5px;color:var(--mute);margin-top:8px;min-height:1em}
.tips{font-size:12.5px;color:var(--mute);margin-top:16px;padding-left:18px}
.tips li{margin-bottom:4px}
#planbox{margin-top:4px}
#tabs{display:flex;gap:4px;background:#f1eee8;padding:4px;border-radius:12px;margin:10px 0 2px}
#tabs{flex-wrap:wrap}
#tabs button{flex:1 1 auto;border:0;background:transparent;padding:7px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute)}
#tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.planhint{font-size:12px;color:var(--mute);margin-bottom:6px}
#plan{width:100%;display:block;border:1px solid var(--line);border-radius:10px;background:#faf8f4;touch-action:none;cursor:default}
#plan:focus{outline:2px solid #2f7fc8;outline-offset:1px}
.pbtns{display:flex;gap:6px;margin-top:6px}.pbtns button{flex:1;font-size:12.5px;padding:6px}
#selrow{display:none;justify-content:space-between;align-items:center;font-size:12.5px;margin-top:8px}
#selrow input{width:70px;padding:2px 5px;border:1px solid var(--line);border-radius:6px;text-align:right}
.hl{margin-top:4px}
.hhead,.hrow{display:grid;grid-template-columns:70px 1fr 48px 26px;gap:5px;align-items:center;margin-bottom:5px}
.hhead{font-size:11px;color:var(--mute)}
.hrow select{padding:3px 2px;border:1px solid var(--line);border-radius:6px;font-size:12.5px}
.hrow .sz{display:flex;align-items:center;gap:3px}.hrow .sz i{font-style:normal;color:var(--mute)}
.hrow input{width:100%;min-width:0;padding:3px 4px;border:1px solid var(--line);border-radius:6px;text-align:right;font-size:12.5px}
.hrow .del{padding:2px 0;font-size:12px;border-radius:6px}
.addhole{width:100%;font-size:12.5px;padding:6px;margin-top:2px}
.saverow{display:flex;gap:6px;margin-bottom:6px}
.saverow input,.saverow select{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.saverow button{font-size:12.5px;padding:6px 10px;white-space:nowrap}
#pasteBox textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px;font-family:ui-monospace,monospace}
#view{position:relative;flex:1;min-width:0}
#c{width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.06);white-space:nowrap}
#hud input{width:200px;accent-color:var(--acc2)}
#hud .lbl{font-size:13px}
#hud .val{font-variant-numeric:tabular-nums;width:40px;text-align:right;font-weight:600}
#legend{position:absolute;top:14px;right:16px;font-size:12px;color:var(--mute);background:rgba(255,255,255,.85);padding:6px 10px;border-radius:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}
@media (max-width:760px){#app{flex-direction:column-reverse;height:auto}#panel{width:100%;border-right:0}#view{height:60vh;flex:none}#hud input{width:120px}}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>3D-print generator</h1>
    <p class="sub">Parametriske modeller til 3D-print. Alle mål i mm.</p>
    <div id="tabs"></div>
    <div id="controls"></div>
    <div id="planbox">
      <div class="planhint" id="planhint"></div>
      <canvas id="plan" tabindex="0"></canvas>
      <div class="pbtns"><button id="addh">+ Væg</button><button id="delw">Slet valgt</button></div>
      <div id="selrow"><span id="sellab"></span><input id="selval" type="number" step="0.5"></div>
      <button id="even" style="width:100%;margin-top:6px;font-size:12.5px;padding:6px">Fordel jævnt</button>
    </div>
    <div class="warn" id="warn"></div>
    <div class="stats" id="stats"></div>
    <button id="dl">Download STL</button>
    <button id="dlExtra"></button>
    <div id="msg"></div>

    <div class="sec">Gem og del</div>
    <div class="saverow"><input id="saveName" placeholder="Navn, fx “Skruer”"><button id="saveBtn">Gem</button></div>
    <div class="saverow"><select id="loadSel"></select><button id="delSave">Slet</button></div>
    <div class="saverow"><button id="copyCode" style="flex:1">Kopiér delekode</button><button id="showPaste" style="flex:1">Indlæs delekode</button></div>
    <div id="pasteBox" style="display:none"><textarea id="codeTa" rows="3" placeholder="Indsæt delekode her"></textarea><button id="loadCode" style="width:100%;margin-top:4px;font-size:12.5px;padding:6px">Indlæs</button></div>
    <div class="note" id="saveMsg" style="margin-top:4px"></div>

    <ul class="tips" id="tips"></ul>
  </aside>
  <main id="view">
    <canvas id="c"></canvas>
    
    <div id="hud"><span class="lbl" id="hudlbl">Åbning</span><input id="ang" type="range" min="0" max="180" step="1" value="110"><span class="val" id="angv">110°</span><button id="pp" style="padding:5px 10px;font-size:12.5px">Printposition</button></div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*GEOM-START*/
// ---------- Geometri (Z op, mm) ----------
function T(o,a,b,c){o.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]);}
function Q(o,a,b,c,d){T(o,a,b,c);T(o,a,c,d);}
function rr(w,d,r,seg){
  r=Math.max(0,Math.min(r,w/2-0.01,d/2-0.01));
  const pts=[],cs=[[w/2-r,d/2-r,0],[-w/2+r,d/2-r,90],[-w/2+r,-d/2+r,180],[w/2-r,-d/2+r,270]];
  for(const [cx,cy,a0] of cs){for(let i=0;i<=seg;i++){const a=(a0+90*(seg?i/seg:0))*Math.PI/180;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}}
  return pts;
}
function prism(o,pts,z0,z1){
  if(z1<=z0)return;const n=pts.length;let cx=0,cy=0;pts.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=n;cy/=n;
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];
    Q(o,[p[0],p[1],z0],[q[0],q[1],z0],[q[0],q[1],z1],[p[0],p[1],z1]);
    T(o,[cx,cy,z1],[p[0],p[1],z1],[q[0],q[1],z1]);
    T(o,[cx,cy,z0],[q[0],q[1],z0],[p[0],p[1],z0]);}
}
function tube(o,out,inn,z0,z1){
  if(z1<=z0)return;const n=out.length;
  for(let i=0;i<n;i++){const j=(i+1)%n,p=out[i],q=out[j],a=inn[i],b=inn[j];
    Q(o,[p[0],p[1],z0],[q[0],q[1],z0],[q[0],q[1],z1],[p[0],p[1],z1]);
    Q(o,[b[0],b[1],z0],[a[0],a[1],z0],[a[0],a[1],z1],[b[0],b[1],z1]);
    Q(o,[p[0],p[1],z1],[q[0],q[1],z1],[b[0],b[1],z1],[a[0],a[1],z1]);
    Q(o,[a[0],a[1],z0],[b[0],b[1],z0],[q[0],q[1],z0],[p[0],p[1],z0]);}
}
// afrundet rektangel som åben bane uden den forreste lige kant (starter ved hjørne 3, slutter ved hjørne 2)
function lo_(pts,n1){return pts.slice(3*n1).concat(pts.slice(0,3*n1));}
function band(o,O,I,z0,z1){
  const m=O.length;
  for(let i=0;i<m-1;i++){const p=O[i],q=O[i+1],a=I[i],b=I[i+1];
    Q(o,[p[0],p[1],z0],[q[0],q[1],z0],[q[0],q[1],z1],[p[0],p[1],z1]);
    Q(o,[b[0],b[1],z0],[a[0],a[1],z0],[a[0],a[1],z1],[b[0],b[1],z1]);
    Q(o,[p[0],p[1],z1],[q[0],q[1],z1],[b[0],b[1],z1],[a[0],a[1],z1]);
    Q(o,[a[0],a[1],z0],[b[0],b[1],z0],[q[0],q[1],z0],[p[0],p[1],z0]);}
  let p=O[0],a=I[0];Q(o,[a[0],a[1],z0],[p[0],p[1],z0],[p[0],p[1],z1],[a[0],a[1],z1]);
  p=O[m-1];a=I[m-1];Q(o,[p[0],p[1],z0],[a[0],a[1],z0],[a[0],a[1],z1],[p[0],p[1],z1]);
}
function box(o,x0,x1,y0,y1,z0,z1){if(x1<=x0||y1<=y0||z1<=z0)return;prism(o,[[x0,y0],[x1,y0],[x1,y1],[x0,y1]],z0,z1);}
function circ(cy,cz,r,s){const p=[];for(let k=0;k<s;k++){const a=2*Math.PI*k/s;p.push([cy+r*Math.cos(a),cz+r*Math.sin(a)]);}return p;}
function cylX(o,x0,x1,cy,cz,r,s=48){
  if(x1<=x0)return;const c=circ(cy,cz,r,s);
  for(let k=0;k<s;k++){const p=c[k],q=c[(k+1)%s];
    Q(o,[x1,p[0],p[1]],[x0,p[0],p[1]],[x0,q[0],q[1]],[x1,q[0],q[1]]);
    T(o,[x1,cy,cz],[x1,p[0],p[1]],[x1,q[0],q[1]]);
    T(o,[x0,cy,cz],[x0,q[0],q[1]],[x0,p[0],p[1]]);}
}
function tubeX(o,x0,x1,cy,cz,ro,ri,s=48){
  if(x1<=x0)return;const A=circ(cy,cz,ro,s),B=circ(cy,cz,ri,s);
  for(let k=0;k<s;k++){const j=(k+1)%s,p=A[k],q=A[j],a=B[k],b=B[j];
    Q(o,[x1,p[0],p[1]],[x0,p[0],p[1]],[x0,q[0],q[1]],[x1,q[0],q[1]]);
    Q(o,[x0,a[0],a[1]],[x1,a[0],a[1]],[x1,b[0],b[1]],[x0,b[0],b[1]]);
    Q(o,[x1,p[0],p[1]],[x1,q[0],q[1]],[x1,b[0],b[1]],[x1,a[0],a[1]]);
    Q(o,[x0,a[0],a[1]],[x0,b[0],b[1]],[x0,q[0],q[1]],[x0,p[0],p[1]]);}
}
// Stjerneformet polygon i (y,z) ekstruderet langs X; første punkt skal kunne "se" alle andre (vifte-triangulering)
function extX(o,pts,x0,x1){
  if(x1<=x0)return;const n=pts.length;
  for(let k=0;k<n;k++){const p=pts[k],q=pts[(k+1)%n];Q(o,[x1,p[0],p[1]],[x0,p[0],p[1]],[x0,q[0],q[1]],[x1,q[0],q[1]]);}
  for(let k=1;k<n-1;k++){const a=pts[0],p=pts[k],q=pts[k+1];T(o,[x1,a[0],a[1]],[x1,p[0],p[1]],[x1,q[0],q[1]]);T(o,[x0,a[0],a[1]],[x0,q[0],q[1]],[x0,p[0],p[1]]);}
}
function halfAt(x,hw,hd,r){r=Math.max(0,Math.min(r,hw,hd));const ax=Math.abs(x);if(ax<=hw-r)return hd;if(ax>=hw)return hd-r;const dx=ax-(hw-r);return hd-r+Math.sqrt(Math.max(0,r*r-dx*dx));}

// --- Triangulering af polygon med huller (øre-klipning med broer) ---
function inTri(p,a,b,c){
  const d1=(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]),d2=(c[0]-b[0])*(p[1]-b[1])-(c[1]-b[1])*(p[0]-b[0]),d3=(a[0]-c[0])*(p[1]-c[1])-(a[1]-c[1])*(p[0]-c[0]);
  return d1>=-1e-12&&d2>=-1e-12&&d3>=-1e-12;
}
const same=(p,q)=>Math.abs(p[0]-q[0])<1e-9&&Math.abs(p[1]-q[1])<1e-9;
function triangulate(outer,holes){
  let poly=outer.map(p=>p.slice());
  const hs=holes.map(h=>h.map(p=>p.slice())).sort((a,b)=>Math.max(...b.map(p=>p[0]))-Math.max(...a.map(p=>p[0])));
  for(const h of hs){
    let hi=0;for(let i=1;i<h.length;i++)if(h[i][0]>h[hi][0])hi=i;
    const M=h[hi];let best=Infinity,bi=-1;const n=poly.length;
    for(let i=0;i<n;i++){const a=poly[i],b=poly[(i+1)%n];
      if((a[1]>M[1])!==(b[1]>M[1])){const x=a[0]+(M[1]-a[1])*(b[0]-a[0])/(b[1]-a[1]);if(x>M[0]&&x<best){best=x;bi=a[0]>b[0]?i:(i+1)%n;}}}
    const I=[best,M[1]],Pp=poly[bi];let pick=bi,minA=Infinity;
    for(let i=0;i<n;i++){const v=poly[i];if(v[0]<M[0])continue;
      if(i===bi||inTri(v,M,I,Pp)||inTri(v,M,Pp,I)){const ang=Math.abs(Math.atan2(v[1]-M[1],v[0]-M[0]));
        if(ang<minA-1e-12||(Math.abs(ang-minA)<1e-12&&v[0]<poly[pick][0])){minA=ang;pick=i;}}}
    // Hvis punktet allerede bruges af en tidligere bro, vælg den forekomst hvis indvendige vinkel indeholder M
    const dups=[];for(let i=0;i<n;i++)if(same(poly[i],poly[pick]))dups.push(i);
    if(dups.length>1){
      const ang=(v,b)=>{let a=Math.atan2(v[1]-b[1],v[0]-b[0]);return a<0?a+2*Math.PI:a;};
      for(const i of dups){const b=poly[i],a=poly[(i+n-1)%n],c=poly[(i+1)%n];
        const a0=ang(c,b),rel=x=>{let r=x-a0;while(r<0)r+=2*Math.PI;while(r>=2*Math.PI)r-=2*Math.PI;return r;};
        if(rel(ang(M,b))<rel(ang(a,b))){pick=i;break;}}
    }
    const ring=h.slice(hi).concat(h.slice(0,hi+1)).map(p=>p.slice());
    poly=poly.slice(0,pick+1).concat(ring,[poly[pick].slice()],poly.slice(pick+1));
  }
  const tris=[];const idx=poly.map((_,i)=>i);let guard=0;
  while(idx.length>3&&guard++<200000){
    let found=false;const L=idx.length;
    for(let k=0;k<L;k++){
      const ia=idx[(k+L-1)%L],ib=idx[k],ic=idx[(k+1)%L],a=poly[ia],b=poly[ib],c=poly[ic];
      const cr=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);if(cr<=1e-10)continue;
      let ok=true;
      for(const j of idx){if(j===ia||j===ib||j===ic)continue;const p=poly[j];if(same(p,a)||same(p,b)||same(p,c))continue;if(inTri(p,a,b,c)){ok=false;break;}}
      if(ok){tris.push([a,b,c]);idx.splice(k,1);found=true;break;}
    }
    if(!found){ // fjern et kollineært/degenereret punkt
      let rm=-1;for(let k=0;k<L;k++){const a=poly[idx[(k+L-1)%L]],b=poly[idx[k]],c=poly[idx[(k+1)%L]];
        const cr=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);if(Math.abs(cr)<=1e-10){rm=k;break;}}
      if(rm<0)break;idx.splice(rm,1);
    }
  }
  if(idx.length===3){const [a,b,c]=idx.map(i=>poly[i]);if((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0])>0)tris.push([a,b,c]);}
  return tris;
}
// plade med huller (huller angives i vilkårlig retning)
function plate(o,outer,holes,z0,z1){
  if(z1<=z0)return;
  const area=p=>{let a=0;for(let i=0;i<p.length;i++){const q=p[i],r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1];}return a;};
  const out=area(outer)>0?outer:outer.slice().reverse();
  const hs=holes.map(h=>area(h)<0?h:h.slice().reverse());
  for(const [a,b,c] of triangulate(out,hs)){T(o,[a[0],a[1],z1],[b[0],b[1],z1],[c[0],c[1],z1]);T(o,[a[0],a[1],z0],[c[0],c[1],z0],[b[0],b[1],z0]);}
  for(const L of [out,...hs])for(let i=0;i<L.length;i++){const p=L[i],q=L[(i+1)%L.length];
    Q(o,[p[0],p[1],z0],[q[0],q[1],z0],[q[0],q[1],z1],[p[0],p[1],z1]);}
}
// plade i lag: feats=[{d,hole}] hvor d er dybden målt fra den ene flade (top=true: fra oversiden)
function layered(o,outer,feats,zA,zB,top,map){
  const dst=map?[]:o;
  const th=zB-zA;const ds=[0,th,...feats.map(f=>Math.min(f.d,th))].sort((a,b)=>a-b).filter((v,i,a)=>i===0||v-a[i-1]>1e-6);
  for(let i=0;i<ds.length-1;i++){const d0=ds[i],d1=ds[i+1];
    const app=feats.filter(f=>f.d>=d1-1e-9),holes=[],grp=new Map();
    for(const f of app){if(f.g==null){holes.push(f.hole);continue;}const c=grp.get(f.g);if(!c||f.d<c.d)grp.set(f.g,f);}
    for(const f of grp.values())holes.push(f.hole);
    const z0=top?zB-d1:zA+d0,z1=top?zB-d0:zA+d1;
    if(holes.length)plate(dst,outer,holes,z0,z1);else plate(dst,outer,[],z0,z1);}
  if(map)pushMapped(o,dst,map);
}
// ekstrudering af en 2D-profil (u,v) langs w; map(u,v,w) skal være en rotation
const MAP_Z=(u,v,w)=>[u,v,w],MAP_X=(u,v,w)=>[w,u,v],MAP_Y=(u,v,w)=>[u,-w,v];
function pushMapped(o,src,map){for(let i=0;i<src.length;i+=3){const p=map(src[i],src[i+1],src[i+2]);o.push(p[0],p[1],p[2]);}}
function extrude(o,poly,holes,a0,a1,map){if(a1<=a0)return;const tmp=[];plate(tmp,poly,holes||[],a0,a1);pushMapped(o,tmp,map||MAP_Z);}
// C-formet ring (kabelkanal) med åbning i retning phi
function cRing(cx,cy,ri,ro,phi,ow,seg=48){
  const ao=Math.asin(Math.min(0.95,ow/2/ro)),ai=Math.asin(Math.min(0.95,ow/2/ri)),p=[];
  for(let k=0;k<=seg;k++){const a=phi+ao+(2*Math.PI-2*ao)*k/seg;p.push([cx+ro*Math.cos(a),cy+ro*Math.sin(a)]);}
  for(let k=0;k<=seg;k++){const a=phi+2*Math.PI-ai-(2*Math.PI-2*ai)*k/seg;p.push([cx+ri*Math.cos(a),cy+ri*Math.sin(a)]);}
  return p;
}
// rektangel med afrundede forhjørner (v fra 0 til d)
function rrFront(w,d,r,seg=8){r=Math.max(0,Math.min(r,w/2-0.01,d-0.01));const p=[[-w/2,0],[w/2,0]];
  if(r<0.05){p.push([w/2,d],[-w/2,d]);return p;}
  for(let k=0;k<=seg;k++){const a=Math.PI/2*k/seg;p.push([w/2-r+r*Math.cos(a),d-r+r*Math.sin(a)]);}
  for(let k=0;k<=seg;k++){const a=Math.PI/2+Math.PI/2*k/seg;p.push([-w/2+r+r*Math.cos(a),d-r+r*Math.sin(a)]);}
  return p;}
// forsænket skruehul (90°) som lag-features, gruppe g
function screwFeats(x,y,sd,hd,th,g){
  const sr=sd/2+0.15,hr=Math.max(sr+0.3,hd/2+0.2),cd=Math.min(hr-sr,th-0.8),f=[{d:th,hole:circ(x,y,sr,32),g}];
  for(let k=0;k<4;k++)f.push({d:cd*(k+1)/4,hole:circ(x,y,hr-(hr-sr)*k/4,32),g});
  return f;}
// tekst-bitmap → fyldkasser uden om bogstaverne (bogstaver bliver fordybninger)
function textFill(tb,cb){const open=new Map();
  for(let r=0;r<=tb.rows;r++){const runs=new Set();
    if(r<tb.rows){let c=0;while(c<tb.cols){if(tb.data[r*tb.cols+c]){c++;continue;}let c1=c;while(c1<tb.cols&&!tb.data[r*tb.cols+c1])c1++;runs.add(c+'-'+c1);c=c1;}}
    for(const k of [...open.keys()])if(!runs.has(k)){const o=open.get(k);cb(o.c0,o.c1,o.r0,r);open.delete(k);}
    for(const k of runs)if(!open.has(k)){const [c0,c1]=k.split('-').map(Number);open.set(k,{c0,c1,r0:r});}}
}

// ---------- Skillevægge ----------
// Tilføjer skillevægge og fingergreb i et indvendigt rum (iw×id, centreret i (ox,oy)), bund i z0, top i 'top'
function addDividers(o,S,iw,id,ir,z0,top,ox,oy){
  const dt=S.dt,DL=divLayout2(S,iw,id),{us,bands,U,V}=DL;
  const tmp=[];const wallBox=r=>box(tmp,r.x0,r.x1,r.y0,r.y1,z0-0.1,top);
  for(const u of us){const h=halfAt(u,U/2,V/2,ir)+0.3;wallBox(DL.rect(u-dt/2,u+dt/2,-h,h));}
  const cells=[];
  for(let c=0;c<=us.length;c++){
    for(const v of bands[c]){const h=halfAt(v,V/2,U/2,ir)+0.3;wallBox(DL.rect(c===0?-h:us[c-1],c===us.length?h:us[c],v-dt/2,v+dt/2));}
    const ua=c===0?-U/2:us[c-1]+dt/2,ub=c===us.length?U/2:us[c]-dt/2;
    const vs=[-V/2,...bands[c].slice().sort((a,b)=>a-b),V/2];
    for(let j=0;j<vs.length-1;j++){const va=j===0?-V/2:vs[j]+dt/2,vb=j===vs.length-2?V/2:vs[j+1]-dt/2;cells.push(DL.rect(ua,ub,va,vb));}
  }
  if(S.scoop>0){
    for(const cl of cells){
      const depth=cl.y1-cl.y0;let r=Math.min(S.scoop,depth*0.6,top-z0);if(r<1.5)continue;
      let x0=cl.x0,x1=cl.x1;
      const atFront=cl.y0<=-id/2+1e-6;
      if(atFront){x0=Math.max(x0,-(iw/2-ir));x1=Math.min(x1,iw/2-ir);}
      const leftWall=cl.x0<=-iw/2+1e-6,rightWall=cl.x1>=iw/2-1e-6;
      x0-=leftWall?0:0.1;x1+=rightWall?0:0.1;
      if(leftWall&&!atFront)x0=Math.max(x0,-halfAt(cl.y0+r,id/2,iw/2,ir));
      if(rightWall&&!atFront)x1=Math.min(x1,halfAt(cl.y0+r,id/2,iw/2,ir));
      if(x1-x0<2)continue;
      const y0=cl.y0,pts=[[y0-0.2,z0-0.1],[y0+r,z0-0.1]];
      for(let k=0;k<=12;k++){const a=(270-90*k/12)*Math.PI/180;pts.push([y0+r+r*Math.cos(a),z0+r+r*Math.sin(a)]);}
      pts.push([y0-0.2,z0+r]);
      extX(tmp,pts,x0,x1);
    }
  }
  for(let i=0;i<tmp.length;i+=3)o.push(tmp[i]+ox,tmp[i+1]+oy,tmp[i+2]);
  return cells.map(c=>({x0:c.x0+ox,x1:c.x1+ox,y0:c.y0+oy,y1:c.y1+oy}));
}
// P.divMode 'cols': primære vægge lodrette (langs dybden), sekundære vandrette pr. kolonne.
// P.divMode 'rows': primære vægge vandrette (langs bredden), sekundære lodrette pr. række.
// P.xs = primære positioner (brøkdel 0..1), P.cols[c] = sekundære i bånd c (brøkdel 0..1)
function divLayout(E){return divLayout2(E,E.W-2*E.t,E.D-2*E.t);}
function divLayout2(E,iw,id){
  const rows=E.divMode==='rows';
  const U=rows?id:iw,V=rows?iw:id;
  const us=(E.xs||[]).map(f=>-U/2+f*U).sort((a,b)=>a-b);
  const bands=us.concat([0]).map((_,c)=>((E.cols||[])[c]||[]).map(f=>-V/2+f*V));
  const toXY=(u,v)=>rows?[v,u]:[u,v];
  const rect=(u0,u1,v0,v1)=>rows?{x0:v0,x1:v1,y0:u0,y1:u1}:{x0:u0,x1:u1,y0:v0,y1:v1};
  return {iw,id,U,V,us,bands,rows,toXY,rect};
}
function eff(P){
  const E=Object.assign({},P);
  E.mr=P.magD/2+0.15;E.md=P.magH+0.2;
  const hasText=!!(P.tb&&P.text&&P.text.trim());
  E.fbB=P.mag?Math.max(P.fb,E.md+0.8):P.fb;
  E.fbL=Math.max(P.fb,P.mag?E.md+0.8:0,hasText?P.textDepth+0.8:0);
  E.hasText=hasText;
  if(P.dimMode==='inner'){E.W=P.W+2*P.t;E.D=P.D+2*P.t;E.Hb=P.Hb+E.fbB;}
  return E;
}
function magCenters(E){
  const iw=E.W-2*E.t,id=E.D-2*E.t,ir=Math.max(0,E.R-E.t),mr=E.mr;
  const m=Math.max(mr+0.6,ir-(ir-mr-0.6)/Math.SQRT2);
  const cx=iw/2-m,cy=id/2-m;
  return {pts:[[cx,cy],[-cx,cy],[-cx,-cy],[cx,-cy]],m,ok:cx>mr+1&&cy>mr+1};
}

function build(P){
  const E=eff(P);
  const warn=[],B=[],L=[];
  const {W,D,Hb,Hl,t,kr,hc}=E,fbB=E.fbB,fbL=E.fbL;
  const R=Math.max(0,Math.min(E.R,W/2-0.5,D/2-0.5));
  const H=Hb+Hl,za=H/2,ay=D/2+kr+hc;
  const pr=Math.max(1.0,kr*0.5),ri=pr+hc;
  if(kr-ri<1.0)warn.push('Ledradius er lille i forhold til frigangen – leddene bliver tynde. Øg ledradius.');
  if(za-kr<0)warn.push('Ledradius er større end halvdelen af den samlede højde. Gør æsken højere eller leddene mindre.');
  const seg=R>0.05?8:0;
  const out=rr(W,D,R,seg),inn=rr(W-2*t,D-2*t,R-t,seg);
  const iw=W-2*t,id=D-2*t,ir=Math.max(0,R-t);
  if(Hb-fbB<3)warn.push('Bunden er meget lav i forhold til bundtykkelsen.');
  if(Hl-fbL<1.5)warn.push('Låget er for lavt til lågets toptykkelse – gør låget højere.');

  // magneter
  let magHoles=[];
  if(E.mag){const mc=magCenters(E);
    if(!mc.ok)warn.push('Der er ikke plads til magneterne – gør æsken større eller magneterne mindre.');
    else magHoles=mc.pts.map(([x,y])=>circ(x,y,E.mr,32));}

  // ---- bund ----
  layered(B,out,magHoles.map(h=>({d:E.md,hole:h})),0,fbB,false);
  if(P.tbF){
    // forvæggen som separat plade med fordybet tekst; resten af væggen som en åben bane
    const n1=seg+1,tbF=P.tbF,xs=W/2-R;
    band(B,lo_(out,n1),lo_(inn,n1),0,Hb);
    const x0=-tbF.cols*tbF.res/2,zt=Hb/2+tbF.rows*tbF.res/2,zb=zt-tbF.rows*tbF.res;
    layered(B,[[-xs,0],[xs,0],[xs,Hb],[-xs,Hb]],[{d:E.textDepth,hole:[[x0,zb],[-x0,zb],[-x0,zt],[x0,zt]]}],D/2-t,D/2,true,MAP_Y);
    textFill(tbF,(c0,c1,r0,r1)=>box(B,x0+c0*tbF.res,x0+c1*tbF.res,-D/2,-D/2+E.textDepth,zt-r1*tbF.res,zt-r0*tbF.res));
  }else tube(B,out,inn,0,Hb);

  // ---- låg ----
  const lidFeats=magHoles.map(h=>({d:E.md,hole:h}));
  let tb=null;
  if(E.hasText){
    tb=P.tb;const x0=-tb.cols*tb.res/2,y1=tb.rows*tb.res/2;
    lidFeats.push({d:E.textDepth,hole:[[x0,-y1],[-x0,-y1],[-x0,y1],[x0,y1]]});
    // fyld uden om bogstaverne (bogstaverne bliver fordybninger)
    const zt0=H-E.textDepth,open=new Map();
    const flush=(k,r)=>{const o=open.get(k);box(L,x0+o.c0*tb.res,x0+o.c1*tb.res,y1-r*tb.res,y1-o.r0*tb.res,zt0,H);open.delete(k);};
    for(let r=0;r<=tb.rows;r++){
      const runs=new Set();
      if(r<tb.rows){let c=0;while(c<tb.cols){if(tb.data[r*tb.cols+c]){c++;continue;}let c1=c;while(c1<tb.cols&&!tb.data[r*tb.cols+c1])c1++;runs.add(c+'-'+c1);c=c1;}}
      for(const k of [...open.keys()])if(!runs.has(k))flush(k,r);
      for(const k of runs)if(!open.has(k)){const [c0,c1]=k.split('-').map(Number);open.set(k,{c0,c1,r0:r});}
    }
  }
  layered(L,out,lidFeats,H-fbL,H,true);
  tube(L,out,inn,Hb,H);

  let lipH=0,lipInfo=null;
  if(E.lip){
    lipH=Math.min(E.lipH,Hb-fbB-1);
    if(lipH<E.lipH)warn.push('Kanthøjden er gjort mindre, så den kan være i bunden.');
    const lb=Math.max(0.6,Math.min(1.5,Hl-fbL));
    const ow=W-2*t-2*E.fit,od=D-2*t-2*E.fit,orr=R-t-E.fit;
    const lo=rr(ow,od,orr,seg),li=rr(ow-2*E.lipT,od-2*E.lipT,orr-E.lipT,seg);
    if(za>=Hb-1e-6){
      tube(L,lo,li,Hb-lipH,Hb+lb);
    }else{
      const yw=halfAt(ow/2,(W-2*t)/2,(D-2*t)/2,Math.max(0,R-t))-E.fit;
      const y1f=(y,z)=>{const dy=y-ay,dz=z-za,rho=Math.hypot(dy,dz);const s=(Hb-za)/rho;if(s>=1)return y;const f=Math.PI-Math.asin(s);return Math.max(y,ay+rho*Math.cos(f));};
      let lo_=-od/2,hi_=od/2;
      for(let it=0;it<50;it++){const m=(lo_+hi_)/2;let ok=true;for(let k=0;k<=6;k++){if(y1f(m,Hb-lipH*k/6)>yw){ok=false;break;}}if(ok)lo_=m;else hi_=m;}
      const rc=Math.max(0,Math.min(orr,ow/2-0.01,od/2-0.01));
      const ye=Math.min(lo_,od/2-rc-0.01,od/2-E.lipT-0.01);
      if(ye>-od/2+rc+2){
        const n1=seg+1,ow2=ow/2,iw2=ow/2-E.lipT;
        const O=[[-ow2,ye],...lo.slice(2*n1,4*n1),[ow2,ye]],I=[[-iw2,ye],...li.slice(2*n1,4*n1),[iw2,ye]];
        band(L,O,I,Hb-lipH,Hb+lb);
      }else warn.push('Hængslet sidder for langt fra kanten til at låget kan få en indvendig kant – slå den fra eller gør låget højere.');
    }
    tube(L,rr(W-t,D-t,R-t/2,seg),li,Hb,Hb+lb);
    lipInfo={od,ow,rc:Math.max(0,Math.min(orr,ow/2-0.01,od/2-0.01))};
  }
  // klik-lås: en lille knast på lågets kant, der klikker forbi en tilsvarende knast på bundens forvæg
  if(E.latch&&E.lip&&lipInfo){
    const avail=lipH-0.6,bh=Math.min(1.2,avail/2-0.05);
    if(bh<0.5)warn.push('Kanthøjden er for lav til klik-låsen – øg kanthøjden til mindst 2,5 mm.');
    else{
      const lw=Math.min(20,lipInfo.ow-2*lipInfo.rc-4);
      if(lw>4){
        const b=(E.latchS+E.fit)/2,yf=-lipInfo.od/2,yw=-id/2;
        const za1=Hb-lipH+0.3,zc1=za1+bh,za2=zc1+0.1,zc2=za2+bh;
        extX(L,[[yf+0.05,za1],[yf+0.05,zc1],[yf-b,(za1+zc1)/2]],-lw/2,lw/2);
        extX(B,[[yw-0.05,za2],[yw+b,(za2+zc2)/2],[yw-0.05,zc2]],-lw/2-2,lw/2+2);
      }
    }
  }
  if(E.grip){const gw=Math.min(24,W-2*R-4);if(gw>4)box(L,-gw/2,gw/2,-D/2-2.5,-D/2+t/2,Hb,H);}

  // ---- skillevægge ----
  const dt=E.dt;
  const topFull=E.lip?Hb-lipH-E.fit-0.2:Hb-0.2;
  const top=fbB+(topFull-fbB)*Math.max(0.1,Math.min(1,(E.divH||100)/100));
  const cells=addDividers(B,E,iw,id,ir,fbB,top,0,0);

  // ---- hængsel ----
  const n=E.n,g=hc,Lh=W-2*Math.max(R,t)-2,sl=(Lh-(n-1)*g)/n;
  if(sl<3)warn.push('For mange led til bredden – vælg færre led.');
  else{
    for(let i=0;i<n;i++){const x0=-Lh/2+i*(sl+g),x1=x0+sl;
      if(i%2===0){
        cylX(B,x0,x1,ay,za,kr);
        box(B,x0,x1,D/2-t/2,ay,0,Math.min(za,Hb));
        if(za>Hb)box(B,x0,x1,D/2+hc,ay,0,za);
      }else{
        tubeX(L,x0,x1,ay,za,kr,ri);
        const ym=ay-(ri+kr)/2;
        box(L,x0,x1,D/2-t/2,ym,Math.max(za,Hb),H);
        if(za<Hb)box(L,x0,x1,D/2+hc,ym,za,H);
      }
    }
    cylX(B,-Lh/2+sl/2,Lh/2-sl/2,ay,za,pr,32);
  }
  return {B,L,ay,za,H,E,warn,cells,inner:[iw,id,Hb-fbB],outer:[W,ay+kr+D/2,H],printLen:2*ay+D};
}
// Lille testprint af hængslet med samme frigang og ledstørrelse
function hingeTestParams(P){
  const h=Math.max(2*P.kr+2,8);
  return {W:34,D:12,Hb:h,Hl:h,R:0,t:P.t,fb:P.fb,lip:false,lipH:3,lipT:1.2,fit:P.fit,grip:false,latch:false,latchS:0.4,
    n:3,kr:P.kr,hc:P.hc,divMode:'cols',xs:[],cols:[[]],dt:1.2,divH:100,scoop:0,mag:false,magD:6,magH:2,text:'',textDepth:0.6,textSize:8,dimMode:'outer'};
}
function rotLid(L,ay,za,deg){
  const th=deg*Math.PI/180,c=Math.cos(th),s=Math.sin(th),o=new Array(L.length);
  for(let i=0;i<L.length;i+=3){const dy=L[i+1]-ay,dz=L[i+2]-za;o[i]=L[i];o[i+1]=ay+dy*c+dz*s;o[i+2]=za-dy*s+dz*c;}
  return o;
}
function printTris(m){const all=m.B.concat(rotLid(m.L,m.ay,m.za,180));for(let i=1;i<all.length;i+=3)all[i]-=m.ay;return all;}
function stl(tris){
  const n=tris.length/9,buf=new ArrayBuffer(84+n*50),dv=new DataView(buf);
  const hdr='Haengslet aeske - print-in-place';for(let i=0;i<hdr.length;i++)dv.setUint8(i,hdr.charCodeAt(i));
  dv.setUint32(80,n,true);let o=84;
  for(let i=0;i<tris.length;i+=9){
    const ax=tris[i],ayy=tris[i+1],az=tris[i+2],bx=tris[i+3],by=tris[i+4],bz=tris[i+5],cx=tris[i+6],cy=tris[i+7],cz=tris[i+8];
    let nx=(by-ayy)*(cz-az)-(bz-az)*(cy-ayy),ny=(bz-az)*(cx-ax)-(bx-ax)*(cz-az),nz=(bx-ax)*(cy-ayy)-(by-ayy)*(cx-ax);
    const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
    dv.setFloat32(o,nx,true);dv.setFloat32(o+4,ny,true);dv.setFloat32(o+8,nz,true);o+=12;
    for(let k=0;k<9;k++){dv.setFloat32(o,tris[i+k],true);o+=4;}
    dv.setUint16(o,0,true);o+=2;
  }
  return new Uint8Array(buf);
}

// ================= SKÅDIS =================
// Pladen: 5 mm tyk, slidser 5×15 mm (R2,5), 40 mm mellem slidser i en række, rækker forskudt 20 mm.
// Krogene sidder fast på tilbehørets bagside: en afrundet krog øverst og evt. en tap 40 mm længere nede.
const SK={pitch:40,cl:0.3,hw:2.8,bh:4.2,Ld:5.6,tw:4.4,Ro:2.4,rf:0.25,bh2:3.8};
SK.dropB=2.5-Math.sqrt(2.5**2-(SK.tw/2)**2); // krogens flade underside hviler på slidsens runde bund
function skadisCols(W,edge){const k=Math.floor((W-2*edge-SK.tw)/SK.pitch);return k>=1?[-k*SK.pitch/2,k*SK.pitch/2]:[0];}
// profil (u,v): u = 0 ved tilbehørets bagside, + ind mod væggen (SKÅDIS-pladen er u∈[0,Tb]); A = startpunkt inde i bagpladen
function skHookProfile(A,top,Tb){
  const {cl,hw,bh,Ld,Ro,rf}=SK,B=Tb+cl,C=B+hw,sb=top-bh,tip=sb-Ld,p=[[A,sb]];
  for(let k=0;k<=6;k++){const a=Math.PI/2-Math.PI/2*k/6;p.push([B-rf+rf*Math.cos(a),sb-rf+rf*Math.sin(a)]);}
  p.push([B,tip+hw/2]);
  for(let k=1;k<=12;k++){const a=Math.PI+Math.PI*k/12;p.push([(B+C)/2+hw/2*Math.cos(a),tip+hw/2+hw/2*Math.sin(a)]);}
  p.push([C,top-Ro]);
  for(let k=1;k<=8;k++){const a=Math.PI/2*k/8;p.push([C-Ro+Ro*Math.cos(a),top-Ro+Ro*Math.sin(a)]);}
  p.push([A,top]);
  return p;
}
// tap (kile) der går ind i en slids længere nede; skrå overside så den kan printes på hovedet
function skStubProfile(A,vs,Tb){const e=Tb-0.5;return [[A,vs],[e,vs],[e,vs+2.5],[1,vs+2.5],[A,vs+2.5+(1-A)]];}
// nederste krog ("flueben"): som den øverste krog, men med skrå overside så den kan printes på hovedet
function skHook2Profile(A,top,Tb){
  const {cl,hw,Ld,rf}=SK,bh=SK.bh2,B=Tb+cl,C=B+hw,sb=top-bh,tip=sb-Ld,r2=1.2,p=[[A,sb]];
  // højden inde i slidsen skal kunne passere, mens tilbehøret er løftet (Ld+0,3) under isætning
  const h0=15-2*SK.dropB-(Ld+0.3)-0.3,us=Math.max(0,Math.min(Tb,h0-bh));
  for(let k=0;k<=6;k++){const a=Math.PI/2-Math.PI/2*k/6;p.push([B-rf+rf*Math.cos(a),sb-rf+rf*Math.sin(a)]);}
  p.push([B,tip+hw/2]);
  for(let k=1;k<=12;k++){const a=Math.PI+Math.PI*k/12;p.push([(B+C)/2+hw/2*Math.cos(a),tip+hw/2+hw/2*Math.sin(a)]);}
  p.push([C,top-r2]);
  for(let k=1;k<=6;k++){const a=Math.PI/2*k/6;p.push([C-r2+r2*Math.cos(a),top-r2+r2*Math.sin(a)]);}
  p.push([us,top],[A,top+(us-A)]);
  return p;
}

    }

    const view=new Array(o.length);for(let i=0;i<o.length;i+=3){view[i]=o[i+2]-w/2;view[i+1]=o[i];view[i+2]=o[i+1];}
    return {tris:o,view,warn,ghost:{x0:-w*2,x1:w*2,y0:0,y1:60,z0:0,z1:T},dims:[w,Lb+th,T+2*th]};
  }
  if(P.mount==='skadis'){

    const bt=Math.max(2.4,P.bt),top=0,A=-bt+0.3,cu=-bt-ro+0.8;
    const vlast=top-ro-1.2-(N-1)*pitch,lowSel=P.skLow||'none';let vb=Math.min(vlast-ro*0.6,top-SK.bh-SK.Ld-4);
    if(lowSel!=='none')vb=Math.min(vb,top-SK.pitch-SK.bh-SK.Ld-1.5);
    let bar=[[-bt,vb],[0,vb],[0,top],[-bt,top]];
    const zh=P.hookPos==='center'?w/2-SK.tw/2:0;
    extrude(o,bar,[],0,w,MAP_Z);
    extrude(o,skHookProfile(A,top,P.Tb),[],zh,zh+SK.tw,MAP_Z);
    const low=skLowerProfile(A,top,P.Tb,vb+0.5,lowSel);
    if(low)extrude(o,low,[],zh,zh+SK.tw,MAP_Z);
    for(let k=0;k<N;k++)extrude(o,cRing(cu,top-ro-1.2-k*pitch,ri,ro,Math.PI,ow),[],0,w,MAP_Z);
    const view=new Array(o.length);for(let i=0;i<o.length;i+=3){view[i]=o[i+2]-w/2;view[i+1]=o[i];view[i+2]=o[i+1]-vb;}
    let mnu=0;for(let i=0;i<o.length;i+=3)mnu=Math.min(mnu,o[i]);
    return {tris:o,view,warn,dims:[w,-mnu+P.Tb+SK.cl+SK.hw,top-vb],skadis:{Tb:P.Tb,vOff:-vb,top:top-vb,hx:zh+SK.tw/2-w/2},needsSupport:zh>0};

  const bt=P.bt,zb=bt-0.8,cz=bt+ro-0.8,yc0=0,yN=(N-1)*pitch,mg=P.mount==='magnet',scr=P.mount==='screw'||mg,two=scr&&P.nscrew===2;
  const tab=scr?(mg?P.magD+4:P.shd+6):2;

  let feats=[];
  if(mg){if(bt<magNeed(P)-1e-6)warn.push(`Bundpladen er for tynd til magneterne – øg den til mindst ${f1n(magNeed(P))} mm.`);
    else feats=magFeats([[0,-ro-tab/2],...(two?[[0,yN+ro+tab/2]]:[])],P);}

    const ao=Math.asin(Math.min(0.95,ow/2/ro)),ai=Math.asin(Math.min(0.95,ow/2/ri)),p=[];
    for(let j=0;j<=16;j++){const a=Math.PI/2+ao+(Math.PI/2-ao)*j/16;p.push([cy+ro*Math.cos(a),cz+ro*Math.sin(a)]);}

}

// ================= INDSATS (USB, SD …) =================
function buildInsert(P){
  const warn=[],o=[],W=P.W,D=P.D,H=P.H,R=Math.max(0,Math.min(P.R,W/2-1,D/2-1,3.4*(P.edge-1.2)-0.1));
  const sw=P.sw,st=P.stk,gx=P.gx,gy=P.gy,e=P.edge;
  const cols=Math.max(0,Math.floor((W-2*e+gx)/(sw+gx))),rows=Math.max(0,Math.floor((D-2*e+gy)/(st+gy)));
  const depth=Math.min(P.sd,H-P.fb);
  if(depth<P.sd-0.01)warn.push('Indsatsen er lavere end slidsdybden – slidserne er gjort lavere.');
  const out=rr(W,D,R,8);
  if(!cols||!rows){warn.push('Der er ikke plads til nogen slidser – gør indsatsen større.');prism(o,out,0,H);return {tris:o,warn,count:0,cols,rows};}
  const gw=cols*sw+(cols-1)*gx,gd=rows*st+(rows-1)*gy;
  const x0=-gw/2-1.2,x1=gw/2+1.2,y0=-gd/2-1.2,y1=gd/2+1.2;
  if(P.mag){const fl=H-depth,mr=P.magD/2+0.15,ex=W/2-mr-2.5,ey=D/2-mr-2.5;
    if(fl<magNeed(P)-1e-6){warn.push(`Bunden under slidserne er for tynd til magneter – gør indsatsen højere (mindst ${f1n(magNeed(P)+depth)} mm).`);prism(o,out,0,H-depth+0.01);}
    else layered(o,out,magFeats([[ex,ey],[-ex,ey],[-ex,-ey],[ex,-ey]],P),0,H-depth+0.01,false);}
  else prism(o,out,0,H-depth+0.01);
  // ring mellem afrundet kant og gitterets rektangel
  const inn=out.map(([px,py])=>{let tx=Infinity;
    if(Math.abs(px)>1e-9)tx=Math.min(tx,(px>0?x1:-x0)/Math.abs(px));
    if(Math.abs(py)>1e-9)tx=Math.min(tx,(py>0?y1:-y0)/Math.abs(py));return [px*tx,py*tx];});
  tube(o,out,inn,H-depth,H);
  // gitteret som kasser uden om slidserne
  const z0=H-depth,ys=[];for(let j=0;j<rows;j++){const a=-gd/2+j*(st+gy);ys.push([a,a+st]);}
  let prev=y0;
  for(const [a,b] of ys){box(o,x0,x1,prev,a,z0,H);
    let px=x0;for(let i=0;i<cols;i++){const c=-gw/2+i*(sw+gx);box(o,px,c,a,b,z0,H);px=c+sw;}box(o,px,x1,a,b,z0,H);prev=b;}
  box(o,x0,x1,prev,y1,z0,H);
  return {tris:o,warn,count:cols*rows,cols,rows,depth};
}

// ================= FYRFADSHOLDER =================
// keglestub om z-aksen: radius r0 i z0 (øverst) til r1 i z1 (nederst)
function frustum(o,r0,z0,r1,z1,s=48){
  const A=circ(0,0,r0,s),B=circ(0,0,Math.max(0.05,r1),s);
  for(let k=0;k<s;k++){const j=(k+1)%s,p=A[k],q=A[j],a=B[k],b=B[j];
    Q(o,[a[0],a[1],z1],[b[0],b[1],z1],[q[0],q[1],z0],[p[0],p[1],z0]);
    T(o,[0,0,z0],[p[0],p[1],z0],[q[0],q[1],z0]);
    T(o,[0,0,z1],[b[0],b[1],z1],[a[0],a[1],z1]);}
}
const rot2=(pts,a)=>pts.map(([x,y])=>[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)]);
function buildCandle(P){
  const o=[],warn=[],Ri=P.cd/2,Ro=Ri+P.t,fb=P.fb,Ht=fb+P.ch,s=96;
  if(P.mag&&P.type!=='spike'){if(fb<magNeed(P)-1e-6){warn.push(`Bunden er for tynd til magneten – øg bundtykkelsen til mindst ${f1n(magNeed(P))} mm.`);prism(o,circ(0,0,Ro,s),0,fb);}
    else layered(o,circ(0,0,Ro,s),magFeats([[0,0]],P),0,fb,false);}
  else prism(o,circ(0,0,Ro,s),0,fb);
  tube(o,circ(0,0,Ro,s),circ(0,0,Ri,s),0,Ht);
  let reach=Ro,depthBelow=0;
  if(P.type==='spike'){
    const rs=P.sd/2,f=Math.max(0.5,Math.min(4,Ro-rs-1));
    frustum(o,rs+f,0.5,rs,-f);
    frustum(o,rs,-f+0.3,P.tip/2,-P.sl);
    depthBelow=P.sl;
    if(P.sl<2*f+5)warn.push('Stilken er meget kort.');
  }
  if(P.type==='eyelet'){
    const ew=P.ew,hr=P.hd/2+0.15,ext=Math.max(P.ep,ew/2+hr+1.2),hx=Ro+ext-ew/2,x0=Ro-Math.min(1.5,P.t-0.1);
    const tab=[[x0,-ew/2],[hx,-ew/2]];for(let k=1;k<16;k++){const a=-Math.PI/2+Math.PI*k/16;tab.push([hx+ew/2*Math.cos(a),ew/2*Math.sin(a)]);}tab.push([hx,ew/2],[x0,ew/2]);
    const hole=circ(hx,0,hr,24);
    const sp=P.en===4?(ew+3)/(2*Ro):0,angs=P.en===4?[-sp,sp,Math.PI-sp,Math.PI+sp]:[0,Math.PI];
    for(const a of angs)plate(o,rot2(tab,a),[rot2(hole,a)],0,Math.min(P.et,Ht));
    reach=Ro+ext;
  }
  return {tris:o,warn,Ht,Ro,reach,depthBelow};
}
// flere stk. i printretning (med stilk: på hovedet)
function candlePrint(m,P){
  const one=P.type==='spike'?flipZ(m.tris,m.Ht):m.tris,n=Math.max(1,P.count|0),cols=Math.ceil(Math.sqrt(n)),pitch=2*m.reach+5,out=[];
  for(let i=0;i<n;i++){const cx=(i%cols-(cols-1)/2)*pitch,cy=(Math.floor(i/cols)-(Math.ceil(n/cols)-1)/2)*pitch;
    for(let k=0;k<one.length;k+=3)out.push(one[k]+cx,one[k+1]+cy,one[k+2]);}
  return out;
}

// ================= STIKDÅSE =================
// P.form: 'clip' (enkelte holdere), 'channel' (samlet holder), 'stand' (skrå stander til bordet)
function mapPts(tr,f){const o=new Array(tr.length);for(let i=0;i<tr.length;i+=3){const p=f(tr[i],tr[i+1],tr[i+2]);o[i]=p[0];o[i+1]=p[1];o[i+2]=p[2];}return o;}
function layout(one,n,pitchX){const out=[],cols=Math.ceil(Math.sqrt(n));let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  for(let i=0;i<one.length;i+=3){mnx=Math.min(mnx,one[i]);mxx=Math.max(mxx,one[i]);mny=Math.min(mny,one[i+1]);mxy=Math.max(mxy,one[i+1]);}
  const px=mxx-mnx+5,py=mxy-mny+5;
  for(let k=0;k<n;k++){const dx=(k%cols)*px-(mnx+mxx)/2,dy=Math.floor(k/cols)*py-(mny+mxy)/2;for(let i=0;i<one.length;i+=3)out.push(one[i]+dx,one[i+1]+dy,one[i+2]);}
  return out;}
// fælles magnet-lommer (åbne mod en flade): punkter → layered-features
function magFeats(pts,P,pre='m'){const mr=P.magD/2+0.15,md=P.magH+0.2;return pts.map(([x,y],i)=>({d:md,hole:circ(x,y,mr,32),g:pre+i}));}
function magNeed(P){return P.magH+0.2+0.8;}
function stripDims(P){const c=0.5,Sw=P.sw+c,Sh=P.sh+c,tb=P.tb;return {c,Sw,Sh,tb,ta:P.ta,lip:P.lip,tl:P.tl,ys:Sw/2,yo:Sw/2+P.ta,top:tb+Sh};}
// arme med kanter i profil (u = højde over bundens bagside, v = på tværs). 'lead' = firkantet kant med indløb, '45' = skrå underside
function armPolys(S,style){const {tb,ys,yo,lip,tl,top}=S,ch=Math.min(1.5,tl*0.6,lip*0.6),res=[];
  for(const s of [1,-1]){const a=style==='lead'?[[tb-0.2,ys],[top,ys],[top,ys-lip],[top+tl-ch,ys-lip],[top+tl,ys-lip+ch],[top+tl,yo],[tb-0.2,yo]]
    :[[tb-0.2,ys],[top,ys],[top+lip,ys-lip],[top+lip+1.2,ys-lip],[top+lip+1.2,yo],[tb-0.2,yo]];
    res.push(a.map(([u,v])=>[u,s*v]));}
  return res;}
// bøjle under bordet med klemme om kanten: stykker i profil (X ind under bordet, Y op; bordets underside ved Y=0)
function underDeskPieces(S,P){const {tb,yo}=S,T=P.T,th=P.th,jaw=P.jaw,sq=P.sq;
  const mp=pl=>pl.map(([u,v])=>[yo+v,-u]);
  const base=mp([[0,-yo],[tb,-yo],[tb,yo],[0,yo]]),arms=armPolys(S,'lead').map(mp);
  const front=[[-th,-tb],[0.1,-tb],[0.1,T+th],[-th,T+th]];
  const top=[[-th,T],[jaw-1.5,T],[jaw,T+1.5],[jaw,T+th],[-th,T+th]];
  const bump=[[2*yo-9,-0.1],[2*yo-2,-0.1],[2*yo-4,sq]];
  return {base,arms,front,top,bump,T,th,jaw};}
function buildStrip(P){
  const warn=[],S=stripDims(P),{c,Sw,Sh,tb,ys,yo,top,lip,tl}=S;
  const magOK=()=>{if(tb<magNeed(P)-1e-6){warn.push(`Bunden er for tynd til magneterne – øg bundtykkelsen til mindst ${f1n(magNeed(P))} mm.`);return false;}return true;};
  if(P.form==='clip'){
    // profil i print-XY: X = ud fra væggen (bund X∈[0,tb]), Y = på tværs af dåsen; ekstruderet i Z = bøjlens bredde
    const o=[],cw=P.cw;
    if(P.mount==='desk'&&P.deskPos==='under'){
      const U=underDeskPieces(S,P);
      for(const pl of [U.base,...U.arms,U.front,U.top,U.bump])extrude(o,pl,[],0,cw,MAP_Z);
      const view=[],L=P.sl;
      for(const xo of [-(L/2-cw-10),L/2-cw-10])view.push(...mapPts(o,(X,Y,Z)=>[xo+Z-cw/2,X,Y]));
      const ghost=[];box(ghost,-L/2-40,L/2+40,0.3,2*yo+40,0,U.T);box(ghost,-L/2,L/2,yo-P.sw/2,yo+P.sw/2,-(tb+P.sh),-tb);
      return {view,ghost,print:layout(o,Math.max(1,P.count|0)),warn,dims:[cw,2*yo+U.th,tb+Sh+tl+U.T+U.th]};
    }
    // bordkant: klemme bag bunden, bordpladens overside i flugt med bøjlens top
    let vb=-yo;
    if(P.mount==='desk'){const T=P.T,th=P.th,jaw=P.jaw,sq=P.sq,yd=yo-th-T;vb=Math.min(-yo,yd-th);
      extrude(o,[[-jaw,yd+T],[0.2,yd+T],[0.2,yo],[-jaw+1.5,yo],[-jaw,yo-1]],[],0,cw,MAP_Z);
      extrude(o,[[0.2,yd-th],[0.2,yd],[-jaw+1.5,yd+sq+0.6],[-jaw,yd+sq],[-jaw,yd-th]],[],0,cw,MAP_Z);}
    let feats=[];
    if(P.mount==='screw'){feats=screwFeats(0,cw/2,P.sd,P.shd,tb,'s');if(cw<P.shd+3)warn.push('Bøjlen er smal i forhold til skruehovedet – gør den bredere.');}
    const useMag=P.mount==='magnet'&&magOK();
    if(useMag&&cw<P.magD+2)warn.push('Bøjlen er smal i forhold til magneterne – gør den bredere.');
    layered(o,[[vb,0],[yo,0],[yo,cw],[vb,cw]],useMag?magFeats([[-Sw/4,cw/2],[Sw/4,cw/2]],P):feats,0,tb,!useMag,MAP_X);
    for(const a of armPolys(S,'lead'))extrude(o,a,[],0,cw,MAP_Z);

      const zh=P.hookPos==='center'?cw/2-SK.tw/2:0,A=-tb+0.3;
      const put=pr=>{const tmp=[];extrude(tmp,pr,[],-(zh+SK.tw),-zh,MAP_Z);o.push(...mapPts(tmp,(u,v,w)=>[-u,v,-w]));};
      put(skHookProfile(A,yo,P.Tb));const low=skLowerProfile(A,yo,P.Tb,-yo+0.5,P.skLow||'hook');if(low)put(low);
      if(!low&&P.skLow!=='none')warn.push('Holderen er for lav til den nederste SKÅDIS-krog – dåsen skal være mindst ca. 50 mm bred.');}
    const view=[],L=P.sl;
    for(const xo of [-(L/2-cw-10),L/2-cw-10])view.push(...mapPts(o,(X,Y,Z)=>[xo+cw/2-Z,-X,Y]));
    const ghost=[];box(ghost,-L/2,L/2,-(tb+Sh-0.3),-tb,-P.sw/2,P.sw/2);

    return {view,ghost,print:layout(o,Math.max(1,P.count|0)),warn,dims:[cw,tb+Sh+tl+(P.mount==='desk'?P.jaw:0),yo-vb]};
  }
  if(P.form==='channel'&&P.mount==='desk'&&P.deskPos==='under'){
    // under bordet: x = langs dåsen, y = ind under bordet, z = op. Printes stående med 45°-ribber under den øverste bøjle.
    const o=[],cw=P.cw,L=P.sl+c,x0=-L/2,x1=L/2,U=underDeskPieces(S,P),Ht=top+tl;
    const X=(pl,a,b)=>extrude(o,pl,[],a,b,MAP_X);
    for(const [a,b] of [[x0,x0+cw],[x1-cw,x1]])for(const pl of [...U.arms,U.top,U.bump])X(pl,a,b);
    X(U.base,x0,x1);X(U.front,x0,x1);
    const xa=x0+cw;
    // ribber: overkæben (ind over bordet), armene (ned) og kanterne
    const W=(y0,y1,z0,z1,toZ)=>{const h=Math.abs(z1-z0);extrude(o,[[xa-0.1,toZ],[xa-0.1,toZ===z0?z1:z0],[xa+h,toZ]],[],-y1,-y0,(u,v,w)=>[u,-w,v]);};
    W(-U.th,U.jaw,U.T,U.T+U.th,U.T);
    for(const [y0,y1] of [[0,S.ta],[2*yo-S.ta,2*yo]])W(y0,y1,-Ht,-tb+0.1,-tb+0.1);
    const print=mapPts(o,(x,y,z)=>[z,y,x1-x]);
    const ghost=[];box(ghost,-L/2-40,L/2+40,0.3,2*yo+40,0,U.T);box(ghost,-P.sl/2,P.sl/2,yo-P.sw/2,yo+P.sw/2,-(tb+P.sh),-tb);
    return {view:o,ghost,print,warn,dims:[L,2*yo+U.th,Ht+U.T+U.th],standing:true};
  }
  if(P.form==='channel'){
    // to bøjler forbundet af en bjælke bagpå. Bygget med bunden nedad: x = langs dåsen, y = på tværs, z = op fra bunden
    const o=[],cw=P.cw,L=P.sl+c,x0=-L/2,x1=L/2,sk=P.mount==='skadis',dk=P.mount==='desk',stand=sk||dk,Ht=top+lip+1.2;
    // bordkant: klemme bag bunden (z<0), bordpladens overside i flugt med holderens top
    const yd=dk?yo-P.th-P.T:0,vb=dk?Math.min(-yo,yd-P.th):-yo;

      if(dk){const jaw=P.jaw,th=P.th,sq=P.sq,T=P.T;
        extrude(o,[[-jaw,yd+T],[0.2,yd+T],[0.2,yo],[-jaw+1.5,yo],[-jaw,yo-1]].map(([u,v])=>[v,u]),[],a,b,MAP_X);
        extrude(o,[[0.2,yd-th],[0.2,yd],[-jaw+1.5,yd+sq+0.6],[-jaw,yd+sq],[-jaw,yd-th]].map(([u,v])=>[v,u]),[],a,b,MAP_X);}}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function zipFiles(files){
  const parts=[],cds=[];let off=0;
  for(const f of files){
    const nb=new TextEncoder().encode(f.name),data=f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);
    const cd=new DataView(new ArrayBuffer(46));
    cd.setUint32(0,0x02014b50,true);cd.setUint16(4,20,true);cd.setUint16(6,20,true);cd.setUint16(14,0x21,true);cd.setUint32(16,crc,true);
    cd.setUint32(20,data.length,true);cd.setUint32(24,data.length,true);cd.setUint16(28,nb.length,true);cd.setUint32(42,off,true);
    parts.push(lh,nb,data);cds.push(cd,nb);off+=30+nb.length+data.length;
  }
  const cdSize=cds.reduce((a,b)=>a+b.byteLength,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);

}

// ---------- Tekst → bitmap ----------
const tbCache=new Map();
function textBitmap(txt,size,maxW,maxH){
  txt=(txt||'').trim();if(!txt||maxW<4||maxH<2)return null;
  const key=[txt,size,maxW.toFixed(2),maxH.toFixed(2)].join('|');if(tbCache.has(key))return tbCache.get(key);
  const res=0.2;let fpx=size/res/0.72;
  const cv=document.createElement('canvas'),c=cv.getContext('2d');
  const font=px=>`700 ${px}px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif`;
  c.font=font(fpx);let w=c.measureText(txt).width;
  if(w*res>maxW){fpx*=maxW/(w*res);c.font=font(fpx);w=c.measureText(txt).width;}
  if(fpx*1.25*res>maxH){fpx=maxH/(1.25*res);c.font=font(fpx);w=c.measureText(txt).width;}
  const cols=Math.max(4,Math.ceil(w)+6),rows=Math.max(4,Math.ceil(fpx*1.25)+4);
  let out=null;
  if(fpx*res*0.72>=1.5&&cols*res<=maxW+3){
    cv.width=cols;cv.height=rows;c.font=font(fpx);c.textAlign='center';c.textBaseline='middle';c.fillStyle='#000';
    c.fillText(txt,cols/2,rows/2+fpx*0.04);
    const img=c.getImageData(0,0,cols,rows).data,data=new Uint8Array(cols*rows);
    for(let i=0;i<cols*rows;i++)data[i]=img[i*4+3]>110?1:0;
    out={cols,rows,res,data};
  }
  tbCache.set(key,out);return out;
}

function change(T,d,v){
  const old=T.P[d.k];
  if(d.k==='prof'){T.P.prof=v;const pv=d.profVals[v];if(pv)for(const [k,val] of Object.entries(pv))T.setCtl(k,val);refresh();sched();return;}
  if(d.k==='tpl'){applyTemplate(T,v);T.setCtl('tpl','');return;}
  if(T.onChange)T.onChange(T,d.k,v,old);
  if(d.k==='preset')return void(refresh(),sched());
  T.P[d.k]=v;
  if(T.after)T.after(T,d.k,v);
  if(d.prof&&T.P.prof!=='custom')T.setCtl('prof','custom');
  if(d.k==='divMode')sel=null;
  refresh();sched();
}

  if(T.hasPlan&&Array.isArray(s.xs)&&Array.isArray(s.cols)&&s.xs.length===T.P.dx){T.P.xs=s.xs.map(f=>clampF(+f));T.P.cols=s.cols.slice(0,T.P.dx+1).map(c=>(Array.isArray(c)?c:[]).map(f=>clampF(+f)));}
  T.framed=false;
  if(cur!==T){try{location.hash=T.id;}catch(e){}switchTool(T.id);}else{sel=null;selCol=0;refresh();sched();}
}
function loadSaves(){try{return JSON.parse(localStorage.getItem(SKEY)||'{}')||{};}catch(e){return {};}}
function storeSaves(o){try{localStorage.setItem(SKEY,JSON.stringify(o));return true;}catch(e){return false;}}
const saveMsg=document.getElementById('saveMsg'),loadSel=document.getElementById('loadSel');
const toolName=s=>(TOOLS.find(t=>t.id===((s&&s.tool)||'aeske'))||TOOLS[0]).name;
function fillSaves(){const o=loadSaves();const names=Object.keys(o).sort((a,b)=>a.localeCompare(b,'da'));
  loadSel.innerHTML=`<option value="">${names.length?'Hent gemt …':'Intet gemt endnu'}</option>`+names.map(n=>`<option value="${n.replace(/"/g,'&quot;')}">${toolName(o[n])}: ${n.replace(/</g,'&lt;')}</option>`).join('');}
document.getElementById('saveBtn').onclick=()=>{const n=document.getElementById('saveName').value.trim()||(cur.name+' '+new Date().toLocaleString('da-DK'));
  const o=loadSaves();o[n]=stateOf(cur);saveMsg.textContent=storeSaves(o)?`Gemt som “${n}” i denne browser.`:'Kunne ikke gemme her – brug delekoden i stedet.';fillSaves();};
loadSel.onchange=()=>{const n=loadSel.value;if(!n)return;const o=loadSaves();try{applyState(o[n]);saveMsg.textContent=`Hentede “${n}”.`;}catch(e){saveMsg.textContent='Kunne ikke hente.';}loadSel.value='';};
document.getElementById('delSave').onclick=()=>{const o=loadSaves();
  const n=loadSel.value||document.getElementById('saveName').value.trim();
  if(!n||!o[n]){saveMsg.textContent='Vælg det gemte i listen (eller skriv navnet) for at slette det.';return;}
  delete o[n];storeSaves(o);fillSaves();saveMsg.textContent=`Slettede “${n}”.`;};
const enc=s=>btoa(unescape(encodeURIComponent(JSON.stringify(s)))),dec=c=>JSON.parse(decodeURIComponent(escape(atob(c.trim()))));
document.getElementById('copyCode').onclick=async()=>{const code='AESKE1:'+enc(stateOf(cur));
  try{await navigator.clipboard.writeText(code);saveMsg.textContent='Delekoden er kopieret. Send den til en anden, som kan indlæse den her.';}
  catch(e){document.getElementById('pasteBox').style.display='block';const ta=document.getElementById('codeTa');ta.value=code;ta.select();saveMsg.textContent='Kunne ikke kopiere automatisk – koden står i feltet, kopiér den selv.';}};
document.getElementById('showPaste').onclick=()=>{const b=document.getElementById('pasteBox');b.style.display=b.style.display==='none'?'block':'none';};
document.getElementById('loadCode').onclick=()=>{const t=document.getElementById('codeTa').value.trim().replace(/^AESKE1:/,'');
  try{applyState(dec(t));saveMsg.textContent='Delekoden er indlæst.';}catch(e){saveMsg.textContent='Det ligner ikke en gyldig delekode.';}};

fillSaves();resize();
switchTool((location.hash||'').slice(1));

</script>
